<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenDeta Code Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f0f4f8; color: #333; font-family: sans-serif; }
        .code-container { background: #f1f5f9; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; margin-top: 10px; }
        .code-header { background: #f8fafc; padding: 12px 16px; display: flex; justify-content: space-between; items-center; border-bottom: 1px solid #e2e8f0; }
        .code-name { font-size: 1.25rem; font-weight: 600; color: #475569; letter-spacing: 0.5px; }
        .copy-btn { color: #64748b; cursor: pointer; transition: 0.2s; }
        .copy-btn:active { transform: scale(0.9); color: #3b82f6; }
        .snippet-box { padding: 15px; font-family: monospace; font-size: 13px; color: #1e293b; background: #fff; max-height: 200px; overflow-y: auto; white-space: pre-wrap; display: none; }
        .see-code-btn { background: #3b82f6; color: white; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: bold; margin-top: 10px; cursor: pointer; display: inline-block; }
    </style>
</head>
<body class="p-5">
    <h1 class="text-2xl font-black text-center text-slate-700 mb-8 uppercase tracking-widest">Code Library</h1>
    
    <div id="codeGrid" class="max-w-xl mx-auto space-y-8">
        <p class="text-center text-slate-400 animate-pulse">কোডগুলো খোঁজা হচ্ছে...</p>
    </div>

    <script>
        const USER = "OpenDeta";
        const REPO = "code-storage"; // গিটহাবে এই নামে রিপোজিটরি খুলবেন

        async function loadCodes() {
            try {
                const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/codes`);
                const files = await res.json();
                const grid = document.getElementById('codeGrid');
                grid.innerHTML = '';

                for (let file of files) {
                    if (file.name.endsWith('.json')) {
                        const codeRes = await fetch(file.download_url);
                        const data = await codeRes.json();
                        
                        const item = document.createElement('div');
                        item.innerHTML = `
                            <div class="mb-2">
                                <h2 class="text-lg font-bold text-slate-800 tracking-tight">${data.fileName}</h2>
                                <div class="code-container shadow-sm">
                                    <div class="code-header">
                                        <span class="code-name">${data.codeType}</span>
                                        <div class="copy-btn" onclick="copyText('${btoa(data.content)}')">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                        </div>
                                    </div>
                                    <div id="content-${file.sha}" class="snippet-box">${data.content}</div>
                                </div>
                                <div class="see-code-btn" onclick="toggleCode('${file.sha}')">See Code...</div>
                            </div>
                        `;
                        grid.appendChild(item);
                    }
                }
            } catch (e) { grid.innerHTML = "Error loading codes."; }
        }

        function toggleCode(id) {
            const el = document.getElementById('content-' + id);
            el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        }

        function copyText(encoded) {
            const text = atob(encoded);
            navigator.clipboard.writeText(text);
            alert("Code Copied! ✅");
        }

        loadCodes();
    </script>
</body>
</html>
